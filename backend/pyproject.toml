[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medislot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "redis>=5.2,<7",
  "email-validator>=2.2,<3", "tzdata>=2025.1"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "httpx>=0.28,<1", "ruff>=0.11,<1", "locust>=2.33,<3", "pip-audit>=2.8,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
